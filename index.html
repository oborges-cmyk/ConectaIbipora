<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta Ibiporã</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="container">
    <h2>Banco de Talentos</h2>
    <form id="talentForm">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" required placeholder="Ex: Maria Silva">

        <label for="talento">Seu Talento / Serviço</label>
        <select id="talento" required>
            <option value="">Selecione...</option>
            <option value="Reforço Escolar">Reforço Escolar</option>
            <option value="Consertos">Consertos / Manutenção</option>
            <option value="Gastronomia">Gastronomia / Culinária</option>
            <option value="Outros">Outros</option>
        </select>

        <label for="contato">Contato (WhatsApp/E-mail)</label>
        <input type="text" id="contato" required placeholder="Ex: (11) 99999-9999">

        <button type="submit">Cadastrar Talento</button>
    </form>
    <div id="mensagem"></div>
</div>
</body>
</html>
